<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Emmanuel Tech ICT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#f4f6f9;color:#111;display:flex;justify-content:center;align-items:center;height:100vh;}
.card{width:100%;max-width:420px;background:#fff;padding:32px;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.12);}
h1{margin:0 0 20px;font-size:26px;text-align:center;}
input{width:100%;padding:14px 16px;margin:10px 0;border:1px solid #d1d5db;border-radius:10px;outline:none;}
button{width:100%;padding:14px 16px;margin-top:14px;border:none;border-radius:10px;background:#0a3d62;color:#fff;font-size:16px;cursor:pointer;}
.error{color:#b91c1c;font-size:14px;margin-top:10px;text-align:center;}
a{color:#0a3d62;text-decoration:none;display:block;margin-top:16px;text-align:center;}
</style>
</head>
<body>
<div class="card">
<h1>Admin Login</h1>
<input id="username" type="text" placeholder="Username" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button onclick="submitLogin()">Sign In</button>
<div id="message" class="error"></div>
<a href="/">Back to site</a>
</div>
<script>
async function submitLogin(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const message = document.getElementById('message');
  message.textContent = '';

  const response = await fetch('/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });

  if (response.ok) {
    window.location.href = '/admin/dashboard';
  } else {
    const data = await response.json();
    message.textContent = data.message || 'Login failed. Check your credentials.';
  }
}
</script>
</body>
</html>
